name: Sync blog posts
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull new posts from metrics.blogg.gu.se
        run: |
          python3 - <<'EOF'
          import json, re, html, urllib.request, xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          req = urllib.request.Request("https://metrics.blogg.gu.se/feed/", headers={"User-Agent": "metriczone-sync"})
          root = ET.fromstring(urllib.request.urlopen(req, timeout=30).read())
          posts = json.load(open("posts.json", encoding="utf-8"))
          known = {p["link"] for p in posts}
          added = 0
          for it in root.iter("item"):
              link = (it.findtext("link") or "").strip()
              if not link or link in known:
                  continue
              text = html.unescape(re.sub(r"<[^>]+>", " ", it.findtext("description") or ""))
              text = re.sub(r"\s+", " ", text).replace("[…]", "").strip()
              if len(text) > 260:
                  text = text[:260].rsplit(" ", 1)[0] + "…"
              posts.append({
                  "title": html.unescape((it.findtext("title") or "").strip()),
                  "link": link,
                  "date": parsedate_to_datetime(it.findtext("pubDate")).strftime("%Y-%m-%d"),
                  "cats": [c.text for c in it.findall("category") if c.text],
                  "summary": text,
              })
              added += 1
          posts.sort(key=lambda p: p["date"], reverse=True)
          json.dump(posts, open("posts.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print("added", added)
          EOF
      - name: Commit if changed
        run: |
          git config user.name "metriczone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || (git commit -m "Sync new blog posts" && git push)
